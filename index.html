<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="shortcut icon" href="https://th.bing.com/th/id/OIP.s9lGJ6yPzizI2rrH6x73qAHaHa?w=174&h=180&c=7&r=0&o=7&dpr=1.3&pid=1.7&rm=3" type="image/x-icon">

    <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@400;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles.css">

</head>
<body>

    <div class="container">

        <h1>Password Generator</h1>

        <div class="display-container">

            <input readonly placeholder="Password" class="display" data-passwordDisplay>

            <button class="copyBtn" data-copy>
                <span class="tooltip" data-copyMsg></span>
                <img src="Copy_Icon.png" alt="copy" width="23" height="23">
            </button>

        </div>


        <div class="input-container">
            <!-- Password length section -->
             <div class="length-container">
                <p>Password Length</p>
                <p data-lengthNumber>0</p>
             </div>

            <!-- slider -->
              <input type="range" min="1" max="40" class="slider" step="1" data-lengthSlider>

            <!-- checkboxes   -->
             <div class="check">
                <input type="checkbox" id="uppercase">
                <label for="uppercase">Includes Uppercase Latters</label>
             </div>

             <div class="check">
                <input type="checkbox" id="lowercase">
                <label for="lowercase">Includes Lowercase Latters</label>
             </div>

             <div class="check">
                <input type="checkbox" id="numbers">
                <label for="numbers">Includes Numbers</label>
             </div>

             <div class="check">
                <input type="checkbox" id="symbols">
                <label for="symbols">Includes Symbols</label>
             </div>

            <!-- strength section  -->
             <div class="strength-container">
                <p>Strength</p>
                <div class="indicator" data-indicator></div>
             </div>

            <!-- generate password  -->
             <button class="generateButton">Generater Password</button>


        </div>

    </div>
    
    <script src="script.js"></script>

</body>
</html>
